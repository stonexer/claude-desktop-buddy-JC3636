[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/> -<jc3636/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:jc3636w518en]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = jc3636w518en
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_resetmethod = usb_reset
upload_flags =
    --before=usb-reset
    --after=hard-reset

board_build.partitions = no_ota.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; JC3636 env uses the NimBLE-flavoured ble_bridge_nimble.cpp under
; src/jc3636/, plus the shared species files from src/buddies/ — those
; compile under the M5 shim in src/jc3636/compat/. src/buddy.cpp is
; replaced by src/jc3636/buddy_mux.cpp (Canvas-based dispatcher).
build_src_filter =
    -<*>
    +<jc3636/>
    +<buddies/>

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DESP_LCD_ST77916_VER_MAJOR=2
    -DESP_LCD_ST77916_VER_MINOR=0
    -DESP_LCD_ST77916_VER_PATCH=2
    -I src/jc3636
    -I src/jc3636/vendor
    -I src/jc3636/compat

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
